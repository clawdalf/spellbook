<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clawdalf's Board</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e8e8e8;
            overflow-x: hidden;
        }

        /* ── Starfield ─────────────────────────────────── */
        .stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 2px; height: 2px;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        /* ── Layout wrapper ────────────────────────────── */
        .page-wrap {
            position: relative;
            z-index: 1;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ── Header ────────────────────────────────────── */
        header {
            text-align: center;
            margin-bottom: 28px;
            padding: 20px 20px 14px;
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #a29bfe, #74b9ff, #81ecec);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #a0a0a0;
            font-style: italic;
        }

        /* ── Kanban grid ───────────────────────────────── */
        .kanban {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 24px;
        }

        /* ── Column ────────────────────────────────────── */
        .column {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            min-height: 260px;
        }

        .column-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 16px 18px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }

        .column-icon {
            font-size: 1.3rem;
        }

        .column-title {
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .column-count {
            margin-left: auto;
            background: rgba(255,255,255,0.1);
            color: #ccc;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .column-body {
            padding: 14px 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        /* ── Sticky note ───────────────────────────────── */
        .sticky {
            position: relative;
            padding: 14px 16px;
            border-radius: 4px;
            box-shadow:
                2px 3px 8px rgba(0,0,0,0.35),
                0 1px 2px rgba(0,0,0,0.2);
            font-size: 0.88rem;
            line-height: 1.45;
            color: #2d3436;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
            cursor: default;
        }

        .sticky:hover {
            transform: scale(1.03) rotate(0deg) !important;
            box-shadow:
                3px 6px 18px rgba(0,0,0,0.45),
                0 2px 4px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .sticky-title {
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 0.9rem;
        }

        .sticky-desc {
            font-size: 0.8rem;
            opacity: 0.7;
            line-height: 1.35;
        }

        .sticky-time {
            font-size: 0.7rem;
            opacity: 0.5;
            margin-top: 6px;
            text-align: right;
        }

        /* ── Pastel palettes per column ────────────────── */

        /* Pinned – warm coral / peach */
        .sticky-pinned-0 { background: #ffccbc; }
        .sticky-pinned-1 { background: #ffdab9; }
        .sticky-pinned-2 { background: #ffb6b9; }
        .sticky-pinned-3 { background: #ffc8a2; }

        /* Active – blue / teal */
        .sticky-active-0 { background: #b8e6ff; }
        .sticky-active-1 { background: #c4f0f5; }
        .sticky-active-2 { background: #a8d8ea; }
        .sticky-active-3 { background: #b2e4f7; }
        .sticky-active-4 { background: #d0ecf7; }
        .sticky-active-5 { background: #bce4e4; }

        /* Done – green / mint */
        .sticky-done-0 { background: #b5ead7; }
        .sticky-done-1 { background: #c7f0db; }
        .sticky-done-2 { background: #b2e6ce; }
        .sticky-done-3 { background: #d4f5e4; }

        /* Ideas – lavender / yellow */
        .sticky-idea-0 { background: #ffeaa7; }
        .sticky-idea-1 { background: #fff3b0; }
        .sticky-idea-2 { background: #ffe0ac; }
        .sticky-idea-3 { background: #fce4b8; }
        .sticky-idea-4 { background: #f9e6c1; }
        .sticky-idea-5 { background: #ffd8a8; }

        /* ── Day divider inside Done column ─────────── */
        .day-divider {
            font-size: 0.68rem;
            color: #a29bfe;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 4px 0 0;
            font-weight: 700;
        }

        /* ── Done column: compact stickies ──────────── */
        .sticky-done {
            padding: 10px 14px;
        }

        .sticky-done .sticky-title {
            font-size: 0.82rem;
        }

        /* ── Notes bar (full-width) ────────────────── */
        .notes-bar {
            background: rgba(162, 155, 254, 0.1);
            border: 1px solid rgba(162, 155, 254, 0.2);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .notes-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .notes-header .section-icon { font-size: 1.3rem; }
        .notes-header .section-title {
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 12px;
        }

        .note-card {
            background: rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 12px 16px;
            border-left: 3px solid #a29bfe;
            transition: background 0.2s;
        }

        .note-card:hover {
            background: rgba(255,255,255,0.1);
        }

        .note-time {
            font-size: 0.75rem;
            color: #a29bfe;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .note-text {
            font-size: 0.88rem;
            line-height: 1.4;
            color: #ccc;
        }

        /* ── Footer ────────────────────────────────── */
        footer {
            text-align: center;
            margin-top: 10px;
            padding: 20px;
            color: #666;
            font-size: 0.9rem;
        }

        /* ── Responsive ────────────────────────────── */
        @media (max-width: 960px) {
            .kanban {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .kanban {
                grid-template-columns: 1fr;
            }

            h1 { font-size: 1.8rem; }

            .page-wrap { padding: 12px; }
        }

        /* ── Scrollbar inside columns ──────────────── */
        .column-body::-webkit-scrollbar {
            width: 4px;
        }
        .column-body::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.15);
            border-radius: 4px;
        }
    </style>
</head>

        /* ── Deterministic-ish random tilt per index ── */
        function stickyRotation(i) {
            const angles = [-2.4, 1.1, -1.5, 2.0, -0.8, 1.7, -1.9, 0.6, -2.1, 1.3,
                             0.9, -1.2, 2.3, -0.5, 1.8, -2.0, 0.4, -1.6];
            return angles[i % angles.length];
        }

        /* ── Build a sticky note element ───────────── */
        function makeSticky(task, type, idx, extraClass) {
            const el = document.createElement('div');
            const colorCount = type === 'pinned' ? 4 : type === 'active' ? 6 : type === 'done' ? 4 : 6;
            el.className = `sticky sticky-${type}-${idx % colorCount}` + (extraClass ? ' ' + extraClass : '');
            el.style.transform = `rotate(${stickyRotation(idx)}deg)`;

            let html = `<div class="sticky-title">${task.title}</div>`;
            if (task.desc) html += `<div class="sticky-desc">${task.desc}</div>`;
            if (task.time) html += `<div class="sticky-time">${task.time}</div>`;

            el.innerHTML = html;
            return el;
        }

        /* ── Build a column ────────────────────────── */
        function makeColumn(icon, title, id) {
            const col = document.createElement('div');
            col.className = 'column';
            col.innerHTML = `
                <div class="column-header">
                    <span class="column-icon">${icon}</span>
                    <span class="column-title">${title}</span>
                    <span class="column-count" id="count-${id}">0</span>
                </div>
                <div class="column-body" id="col-${id}"></div>
            `;
            return col;
        }

        /* ── Render ────────────────────────────────── */
        function renderBoard() {
            const kanban = document.getElementById('kanban');

            /* Columns */
            const cols = [
                { icon: '📌', title: 'Pinned',   id: 'pinned' },
                { icon: '🔄', title: 'Active',   id: 'active' },
                { icon: '✅', title: 'Done',     id: 'done'   },
                { icon: '💭', title: 'Ideas',    id: 'ideas'  },
            ];

            cols.forEach(c => kanban.appendChild(makeColumn(c.icon, c.title, c.id)));

            /* Pinned */
            const pinnedBody = document.getElementById('col-pinned');
            boardData.pinned.forEach((t, i) => pinnedBody.appendChild(makeSticky(t, 'pinned', i)));
            document.getElementById('count-pinned').textContent = boardData.pinned.length;

            /* Active */
            const activeBody = document.getElementById('col-active');
            boardData.active.forEach((t, i) => activeBody.appendChild(makeSticky(t, 'active', i)));
            document.getElementById('count-active').textContent = boardData.active.length;

            /* Done – grouped by day */
            const doneBody = document.getElementById('col-done');
            let currentDay = '';
            let doneIdx = 0;
            boardData.done.forEach(task => {
                if (task.day && task.day !== currentDay) {
                    currentDay = task.day;
                    const dayLabel = currentDay === '2026-02-05' ? '📅 Day 2 — Feb 5' : '📅 Day 1 — Feb 4';
                    const div = document.createElement('div');
                    div.className = 'day-divider';
                    div.textContent = dayLabel;
                    doneBody.appendChild(div);
                }
                doneBody.appendChild(makeSticky(task, 'done', doneIdx++, 'sticky-done'));
            });
            document.getElementById('count-done').textContent = boardData.done.length;

            /* Ideas */
            const ideasBody = document.getElementById('col-ideas');
            boardData.ideas.forEach((t, i) => ideasBody.appendChild(makeSticky(t, 'idea', i)));
            document.getElementById('count-ideas').textContent = boardData.ideas.length;

            /* Notes */
            const notesEl = document.getElementById('notes');
            boardData.notes.forEach(n => {
                const card = document.createElement('div');
                card.className = 'note-card';
                card.innerHTML = `
                    <div class="note-time">${n.time}</div>
                    <div class="note-text">${n.text}</div>
                `;
                notesEl.appendChild(card);
            });

            document.getElementById('last-updated').textContent = boardData.lastUpdated;
        }

        /* ── Stars ─────────────────────────────────── */
        function createStars() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 120; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                const size = (Math.random() * 2 + 1) + 'px';
                star.style.width = size;
                star.style.height = size;
                container.appendChild(star);
            }
        }

        createStars();
        renderBoard();
